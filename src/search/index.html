<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Search and discover manga and manhwa titles.">

    <meta name="author" content="Manuela Alejandra Rodriguez Cardenas">

    <title>
        Explore Manga | Manga & Manhwa Explorer
    </title>

    <link rel="stylesheet" href="../css/styles.css">

    <link rel="stylesheet" href="../css/animations.css">
</head>

<body>

    <header>

        <nav class="navbar" aria-label="Main navigation">

            <a href="index.html" class="logo">
                <img src="../images/gato.png" alt="" class="logo-image">
            
                <span>
                    Manga & Manhwa Explorer
                </span>
            </a>

            <button type="button" class="menu-button" id="menu-button" aria-label="Open navigation menu"
                aria-expanded="false" aria-controls="nav-links">
                ☰
            </button>

            <ul class="nav-links" id="nav-links">

                <li>
                    <a href="../index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="index.html" aria-current="page">
                        Explore
                    </a>
                </li>

                <li>
                    <a href="../favorites/index.html">
                        Favorites
                    </a>
                </li>

            </ul>

        </nav>

    </header>

    <main>

        <section class="featured-section" aria-labelledby="search-heading">

            <div class="section-heading">

                <p class="eyebrow">
                    Explore
                </p>

                <h1 id="search-heading">
                    Search Manga & Manhwa
                </h1>

                <p>
                    Search for your next manga or manhwa to read.
                </p>

            </div>

            <form class="search-form" id="search-form">

                <label for="search-input" class="sr-only">
                    Search manga or manhwa
                </label>

                <input type="search" id="search-input" name="search" placeholder="Search by title..." autocomplete="off"
                    required>

                <button type="submit">
                    Search
                </button>

            </form>

            <p id="search-status" class="status-message" aria-live="polite">
                Enter a title to search.
            </p>

            <div id="search-results" class="manga-grid" aria-live="polite"></div>

            <nav id="search-pagination" class="pagination" aria-label="Search results pages"></nav>

        </section>

    </main>

    <footer>

        <p>
            &copy; 2026 Manga & Manhwa Explorer
        </p>

    </footer>

    <script type="module" src="../js/navigation.js"></script>

    <script type="module" src="../js/search.js"></script>

</body>

</html>
