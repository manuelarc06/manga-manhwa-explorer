<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Explore detailed manga and manhwa information, characters, genres, staff, recommendations and related titles.">

    <meta name="theme-color" content="#15121f">

    <title>Manga Details | Manga & Manhwa Explorer</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/animations.css">

<body>

    <header>
